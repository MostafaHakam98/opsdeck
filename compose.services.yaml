# Optional native service-health bridge. Run deploy.export_services on the host first.
services:
  opsdeck:
    environment:
      OPSDECK_SERVICES_FILE: /host-services/service-status.json
    volumes:
      - type: bind
        source: '${OPSDECK_SERVICE_EXPORT_DIR:-./data}'
        target: /host-services
        read_only: true
        bind:
          create_host_path: false
